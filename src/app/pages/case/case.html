<section class="access-card">

  <div class="access-header">

    <div>
      <span class="eyebrow">
        SECURE INVESTIGATIVE ACCESS
      </span>

      <h2>
        Dark Web Credentials
      </h2>
    </div>

    <span class="access-status">
      ACTIVE
    </span>

  </div>


  <p class="access-warning">
    The following credentials have been issued for
    authorized investigative use. All activity is
    logged and monitored by Hollow Creek Police
    Department.
  </p>


  <div class="credentials">

    <div class="credential">

      <span>
        USERNAME
      </span>

      <strong>
        {{ access.username }}
      </strong>

    </div>


    <div class="credential">

      <span>
        PASSWORD
      </span>

      <strong>
        {{ access.password }}
      </strong>

    </div>

  </div>


  <div class="access-note">

    ACCESS LEVEL:
    <strong>RESTRICTED</strong>

  </div>

</section>
